[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stressonnx"
dynamic = ["version"]
description = "Pure-onnxruntime multi-language word-stress / accentuation"
license = {text = "Apache-2.0"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
authors = [{name = "JarbasAI", email = "jarbasai@mailfence.com"}]
readme = "README.md"
requires-python = ">=3.10"  # PEP 604 unions in evaluated positions; CI matrix floor
dependencies = [
    "numpy",
    "onnxruntime",
    "huggingface_hub",
    # used only by the ruaccent backend, but ru is the default language —
    # kept as a hard dependency so the default path works out of the box
    "tokenizers",
]

[project.urls]
Homepage = "https://github.com/TigreGotico/stressonnx"

[project.optional-dependencies]
export = [
    "torch",
    "silero_stress",
]
test = [
    "pytest",
    "hypothesis",
]

[tool.setuptools.dynamic]
version = {attr = "version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["stressonnx*"]

[tool.setuptools.package-data]
"stressonnx" = ["py.typed", "languages/*.json"]
