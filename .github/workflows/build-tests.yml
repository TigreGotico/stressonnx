name: Build Tests

on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: OpenVoiceOS/gh-automations/.github/workflows/build-tests.yml@dev
    secrets: inherit
    with:
      python_versions: '["3.11", "3.12", "3.13"]'
      install_extras: 'test'
      test_path: 'tests benchmarks/test_scoring.py --ignore=tests/test_export_parity.py'
