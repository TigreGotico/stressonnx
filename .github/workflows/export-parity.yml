name: Export Parity

# Parity of the ONNX runtime against the reference silero_stress library.
# Torch is heavy, so this runs on a single Python version outside the
# build-tests matrix.

on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Cache models and packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/pip
          key: export-parity-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
      - name: Install with export extra
        run: |
          python -m pip install uv
          uv pip install --system .[test,export]
      - name: Run parity tests
        run: python -m pytest tests/test_export_parity.py -v
